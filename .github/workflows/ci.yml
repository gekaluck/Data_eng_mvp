name: CI

# Deliberately cheap and honest: static checks plus pure-Python AI guardrail tests. It does NOT
# start Docker, Airflow, Spark, MinIO, or Trino, and does NOT run the pipeline
# end-to-end (that needs a full `docker compose up` and a real COINCAP_API_KEY).
# It catches syntax errors, obvious Python mistakes, dbt project breakage, and deterministic
# SQL guardrail regressions without contacting an LLM provider.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ai-agent:
    name: AI guardrail tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai_agent/requirements*.txt
      - name: Install isolated AI dependencies
        run: pip install -r ai_agent/requirements-dev.txt
      - name: Lint AI code for correctness
        run: ruff check --select E9,F63,F7,F82 ai_agent
      - name: Compile AI modules
        run: python -m compileall ai_agent
      - name: Run deterministic guardrail tests
        run: python -m pytest ai_agent/tests -v

  python:
    name: Python static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Lint for errors (syntax + undefined names)
        # Error-class rules only — this is a correctness gate, not a style gate.
        run: ruff check --select E9,F63,F7,F82 dags spark superset tests scripts
      - name: Compile all modules
        run: python -m compileall dags spark superset tests scripts

  dbt:
    name: dbt parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dbt (core + trino adapter)
        run: pip install "dbt-core~=1.10.0" "dbt-trino~=1.10.0"
      - name: Parse the dbt project
        # `dbt parse` builds the manifest and validates refs/sources without
        # opening a Trino connection. The profile resolves from env-var defaults.
        run: dbt parse --project-dir dbt --profiles-dir dbt
